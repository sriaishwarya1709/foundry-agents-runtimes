[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-invoice-runtimes"
version = "0.1.0"
description = "Compare Foundry prompt, Copilot harness, and resilient hosted agents."
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.12.0,<4",
    "azure-ai-projects>=2.9.0,<3",
    "azure-ai-agentserver-responses>=2.4.0,<3",
    "azure-identity>=1.25.0,<2",
    "azure-storage-blob>=12.26.0,<13",
    "azure-monitor-opentelemetry>=1.8.0,<2",
    "azure-monitor-opentelemetry-exporter>=1.0.0b40,<2",
    "fastapi>=0.115.0,<1",
    "httpx>=0.28.0,<1",
    "opentelemetry-sdk>=1.37.0,<2",
    "pydantic>=2.11.0,<3",
    "uvicorn>=0.35.0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "reportlab>=4,<5", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
include = ["invoice_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
